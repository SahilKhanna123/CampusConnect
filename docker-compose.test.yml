# Disposable local Postgres for DB-backed tests (npm run test:db). Not used
# for app development -- that still points at the shared Supabase dev DB per
# .env. No volume on purpose: this container's data is never meant to
# survive a `docker compose down`, since every *.db.test.ts file truncates
# and re-seeds its own state per test (see src/lib/testDb.ts).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusconnect_test
    ports:
      # 5433, not 5432 -- avoids clashing with a Postgres already running
      # locally (e.g. another project's dev DB).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
